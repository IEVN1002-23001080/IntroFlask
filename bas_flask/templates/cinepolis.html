
{% extends 'layout.html' %}

{% block container %}
<div class="container mt-4">
    <h1 class="text-center bg-primary text-white p-3 rounded">Cinépolis</h1>

    <div class="row mt-4">
        <div class="col-md-6">
            <h2>Entradas</h2>

            <form action="{{ url_for('cinepolis') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Nombre:</label>
                    <input type="text" name="nombre" class="form-control" value="{{ nombre }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Cantidad de compradores:</label>
                    <input type="number" name="cantidadCompradores" class="form-control" min="1" value="{{ compradores }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">¿Tienes tarjeta Cineco?</label>

                    <div class="form-check">
                        <input type="radio" name="tarjetaCineco" value="Si" class="form-check-input" {% if tarjeta == 'Si' %}checked{% endif %}>
                        <label class="form-check-label">Sí</label>
                    </div>

                    <div class="form-check">
                        <input type="radio" name="tarjetaCineco" value="No" class="form-check-input" {% if tarjeta == 'No' %}checked{% endif %}>
                        <label class="form-check-label">No</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Cantidad de boletos:</label>
                    <input type="number" name="cantidadBoletos" class="form-control" min="1" value="{{ boletos }}" required>
                </div>

                <button type="submit" class="btn btn-primary">Procesar</button>
                <a href="{{ url_for('cinepolis') }}" class="btn btn-secondary">Limpiar</a>
            </form>
        </div>

        <div class="col-md-6">
            <h2>Salidas</h2>

            <div class="mb-3">
                <label class="form-label">Valor a pagar:</label>
                <input type="text" class="form-control" value="{% if valorPagar is not none %}${{ '%.2f'|format(valorPagar) }}{% else %}$0.00{% endif %}" readonly>
            </div>

            {% if mensaje %}
                <p>{{ mensaje }}</p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
