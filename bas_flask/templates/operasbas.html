{% extends 'layout.html' %}

{% block container %} 
<div class="container mt-4">
    <h1>OPERASBAS</h1>
    
    <form action="/operasbas" method="post">
        <div class="mb-3">
            <label for="n1" class="form-label">Número 1:</label>
            <input type="number" step="any" class="form-control" id="n1" name="n1" required>
        </div>

        <div class="mb-3">
            <label for="n2" class="form-label">Número 2:</label>
            <input type="number" step="any" class="form-control" id="n2" name="n2" required>
        </div>

        <label class="form-label">Seleccione la operación:</label>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="operacion" id="sumar" value="sumar" checked>
            <label class="form-check-label" for="sumar">Sumar</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="operacion" id="restar" value="restar">
            <label class="form-check-label" for="restar">Restar</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="operacion" id="multiplicar" value="multiplicar">
            <label class="form-check-label" for="multiplicar">Multiplicar</label>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Calcular</button>
    </form>

    {% if res is not none %}
        <h1 class="mt-4">
            El resultado de {{ n1 }} y {{ n2 }} es: {{ "%.2f"|format(res) }}
        </h1>
    {% endif %}
</div>
{% endblock %}
